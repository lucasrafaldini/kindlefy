[project]
name = "kindlefy-engine"
version = "0.1.0"
description = "Kindlefy Core Conversion Engine & Gemma 2 2B Assistente de Formatação e Contexto for PDF/Text to EPUB3 & MOBI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "chardet>=5.2.0",
    "markdown>=3.6",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "rapidocr-onnxruntime>=1.4.4",
    "llama-cpp-python>=0.3.36",
]

[project.optional-dependencies]
llm = [
    "llama-cpp-python>=0.2.85",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
kindlefy-engine = "kindlefy_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
